[package]
name = "freepinpaste-ocr-worker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
liteparse = { version = "=2.21.0", default-features = false, features = ["ocria-nano"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
strip = true
